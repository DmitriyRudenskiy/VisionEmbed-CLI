<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчет о дубликатах</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --border: #e5e7eb;
            --border-hover: #d1d5db;
            --text: #111827;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --accent: #3b82f6;
            --accent-bg: #eff6ff;
            --accent-border: #bfdbfe;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --success: #22c55e;
            --success-bg: #f0fdf4;
            --radius: 10px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
        }

        .app-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header { margin-bottom: 1.5rem; }
        .header h1 {
            font-size: 1.5rem; font-weight: 600;
            letter-spacing: -0.02em; margin-bottom: 1.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem; margin-bottom: 1.5rem;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s;
        }
        .stat-card:hover { box-shadow: var(--shadow-md); }
        .stat-label {
            font-size: 0.8rem; font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        .stat-value {
            font-size: 1.5rem; font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .stat-value.accent { color: var(--accent); }
        .stat-value.danger { color: var(--danger); }

        /* Controls – прилипает к низу экрана */
        .controls-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            display: none;
            flex-wrap: wrap; gap: 0.75rem;
            align-items: center;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
            position: sticky;
            bottom: 0;
            z-index: 50;
        }
        .controls-bar.visible { display: flex; }

        .search-input {
            flex: 1; min-width: 220px;
            padding: 0.5rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: var(--font);
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .search-input::placeholder { color: var(--text-tertiary); }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        .btn {
            padding: 0.5rem 1rem; border-radius: 8px;
            font-size: 0.85rem; font-weight: 500;
            cursor: pointer; border: 1px solid var(--border);
            background: var(--surface); color: var(--text);
            transition: all 0.2s; font-family: var(--font);
            white-space: nowrap;
        }
        .btn:hover { background: var(--bg); border-color: var(--border-hover); }
        .btn-danger {
            background: var(--danger-bg); color: var(--danger);
            border-color: var(--danger-border);
        }
        .btn-danger:hover {
            background: var(--danger); color: #fff;
            border-color: var(--danger);
        }
        .btn-danger:disabled {
            opacity: 0.4; cursor: not-allowed;
            background: var(--danger-bg); color: var(--danger);
            border-color: var(--danger-border);
        }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; }

        /* Bash output textarea */
        .bash-output-container {
            display: none;
            margin-bottom: 1.5rem;
        }
        .bash-output-container.visible { display: block; }
        #bashOutput {
            width: 100%;
            font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.85rem;
            padding: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            resize: vertical;
            min-height: 6rem;
        }

        /* Upload zone */
        .upload-zone {
            max-width: 640px; margin: 6rem auto; text-align: center;
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 4rem 2rem;
            background: var(--surface);
            cursor: pointer; transition: all 0.2s;
        }
        .upload-zone:hover {
            border-color: var(--accent);
            background: var(--accent-bg);
        }
        .upload-zone.dragover {
            border-color: var(--accent);
            background: var(--accent-bg);
        }
        .upload-zone.hidden { display: none; }
        .upload-zone h2 { font-size: 1.25rem; font-weight: 500; margin-bottom: 0.5rem; }
        .upload-zone p { color: var(--text-secondary); font-size: 0.9rem; }
        .upload-zone .upload-icon {
            width: 48px; height: 48px; margin: 0 auto 1.5rem;
            border-radius: 12px; background: var(--accent-bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
        }

        /* Drop overlay */
        .drop-overlay {
            position: fixed; inset: 0; z-index: 999;
            background: rgba(255,255,255,0.9);
            display: none; align-items: center; justify-content: center;
            flex-direction: column; gap: 1rem;
            border: 3px dashed var(--accent);
            margin: 16px; border-radius: 16px;
        }
        .drop-overlay.active { display: flex; }
        .drop-overlay .drop-icon {
            width: 80px; height: 80px; border-radius: 16px;
            background: var(--accent-bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
        }
        .drop-overlay p { color: var(--text); font-size: 1.1rem; font-weight: 500; }
        .drop-overlay .sub { color: var(--text-secondary); font-size: 0.85rem; font-weight: 400; }

        /* Groups */
        .groups-container { display: flex; flex-direction: column; gap: 1.5rem; }
        .group-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .group-header {
            padding: 1rem 1.25rem;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 0.75rem;
        }
        .group-title {
            display: flex; align-items: center; gap: 10px;
            font-weight: 600; font-size: 0.95rem;
        }
        .badge {
            background: var(--accent-bg); color: var(--accent);
            padding: 0.2rem 0.65rem; border-radius: 99px;
            font-size: 0.75rem; font-weight: 500;
            border: 1px solid var(--accent-border);
        }
        .group-actions { display: flex; align-items: center; gap: 8px; }

        /* File cards */
        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem; padding: 1.25rem;
        }
        .file-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden; transition: all 0.2s;
            position: relative; display: flex; flex-direction: column;
        }
        .file-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        /* Самый крупный файл в группе */
        .file-card.first {
            background: var(--success-bg);
            border-color: var(--success);
        }
        .file-card.selected {
            background: var(--accent-bg);
            border-color: var(--accent-border);
        }

        .card-image-wrapper {
            width: 100%; aspect-ratio: 3/4;
            background: var(--bg);
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .card-image-wrapper .placeholder-icon {
            color: var(--text-tertiary); font-size: 2rem;
            position: absolute; transition: opacity 0.3s;
        }
        .card-image {
            width: 100%; height: 100%; object-fit: cover;
            position: relative; z-index: 2;
        }
        .card-image.loaded { opacity: 1; }

        .card-checkbox {
            position: absolute; top: 8px; left: 8px;
            width: 18px; height: 18px; z-index: 10;
            cursor: pointer; accent-color: var(--accent);
        }

        .card-info {
            padding: 0.75rem;
            flex: 1; display: flex; flex-direction: column; gap: 4px;
            border-top: 1px solid var(--border);
        }
        .card-size {
            font-size: 0.7rem; font-weight: 600;
            color: var(--accent); text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .card-name {
            font-size: 0.8rem; color: var(--text);
            line-height: 1.35;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
            word-break: break-word;
        }

        /* Lightbox */
        .lightbox {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(255,255,255,0.95);
            display: none; align-items: center; justify-content: center;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-height: 88vh; max-width: 88vw;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .lightbox-close {
            position: absolute; top: 20px; right: 24px;
            font-size: 1.25rem; cursor: pointer;
            color: var(--text-secondary);
            background: var(--surface); border: 1px solid var(--border);
            width: 36px; height: 36px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .lightbox-close:hover { background: var(--bg); color: var(--text); }
        .lightbox-info {
            position: absolute; bottom: 24px; left: 50%;
            transform: translateX(-50%);
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 0.5rem 1rem;
            font-size: 0.8rem; color: var(--text-secondary);
            max-width: 80vw;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Toast */
        .toast-container {
            position: fixed; bottom: 24px; right: 24px;
            z-index: 2000; display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem; color: var(--text);
            box-shadow: var(--shadow-md);
            animation: toast-in 0.3s ease;
            display: flex; align-items: center; gap: 8px;
            max-width: 360px;
        }
        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--danger); }
        .toast.info { border-left: 3px solid var(--accent); }
        .toast.removing { animation: toast-out 0.25s ease forwards; }

        @keyframes toast-in {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toast-out {
            to { opacity: 0; transform: translateY(12px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container { padding: 1rem; }
            .header h1 { font-size: 1.35rem; }
            .files-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.75rem; padding: 0.75rem;
            }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="drop-overlay" id="dropOverlay">
        <div class="drop-icon">🖼</div>
        <p>Перетащите папку с изображениями</p>
        <p class="sub">для загрузки миниатюр</p>
    </div>

    <div class="app-container">
        <header class="header">
            <h1>Отчет о дубликатах</h1>
            <div class="stats-grid" id="statsGrid" style="display:none;">
                <div class="stat-card">
                    <div class="stat-label">Групп</div>
                    <div class="stat-value accent" id="statGroups">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Файлов</div>
                    <div class="stat-value" id="statFiles">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Общий размер</div>
                    <div class="stat-value" id="statSize">0 B</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Можно освободить</div>
                    <div class="stat-value danger" id="statSavings">0 B</div>
                </div>
            </div>
        </header>

        <!-- Липкая панель управления -->
        <div class="controls-bar" id="controlsBar">
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск по имени файла…">
            <button class="btn btn-sm" onclick="selectAllDuplicates()">Выбрать все дубли</button>
            <button class="btn btn-danger" id="deleteBtn" disabled onclick="generateBashCommands()">
                Удалить отмеченное (<span id="selectedCount">0</span>)
            </button>
        </div>

        <!-- Блок для сгенерированного Bash-скрипта -->
        <div id="bashOutputContainer" class="bash-output-container">
            <textarea id="bashOutput" readonly rows="8" placeholder="#!/bin/bash …"></textarea>
        </div>

        <div id="uploadZone" class="upload-zone">
            <div class="upload-icon">📄</div>
            <h2>Загрузите duplicates.json</h2>
            <p>Перетащите файл сюда или нажмите для выбора</p>
            <input type="file" id="jsonInput" accept=".json" style="display:none">
        </div>

        <div id="groupsContainer" class="groups-container"></div>
    </div>

    <div class="lightbox" id="lightbox" onclick="if(event.target===this) closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <img id="lightboxImg" src="" alt="Preview">
        <div class="lightbox-info" id="lightboxInfo"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        let rawData = null;
        let imageCache = new Map();
        let selectedFiles = new Set();

        const $ = id => document.getElementById(id);

        // ── Toast ──
        function showToast(message, type = 'info') {
            const container = $('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 250);
            }, 3000);
        }

        // ── JSON Upload ──
        const uploadZone = $('uploadZone');
        const jsonInput = $('jsonInput');

        uploadZone.onclick = () => jsonInput.click();
        uploadZone.ondragover = e => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        };
        uploadZone.ondragleave = () => uploadZone.classList.remove('dragover');
        uploadZone.ondrop = e => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.json')) {
                handleJSON(file);
            } else {
                showToast('Нужен файл .json', 'error');
            }
        };
        jsonInput.onchange = e => { if (e.target.files.length) handleJSON(e.target.files[0]); };

        // ── Global image drag & drop ──
        let dragCounter = 0;
        const dropOverlay = $('dropOverlay');

        document.body.addEventListener('dragenter', e => {
            e.preventDefault();
            dragCounter++;
            if (dragCounter === 1 && rawData) dropOverlay.classList.add('active');
        });
        document.body.addEventListener('dragleave', e => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter === 0) dropOverlay.classList.remove('active');
        });
        document.body.addEventListener('dragover', e => e.preventDefault());
        document.body.addEventListener('drop', e => {
            e.preventDefault();
            dragCounter = 0;
            dropOverlay.classList.remove('active');
            if (e.dataTransfer.files.length && rawData) {
                handleFolder(e.dataTransfer.files);
            }
        });

        // ── Data Loading ──
        function handleJSON(file) {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    rawData = JSON.parse(e.target.result);
                    renderStats();
                    renderGroups();
                    uploadZone.classList.add('hidden');
                    $('statsGrid').style.display = 'grid';
                    $('controlsBar').classList.add('visible');
                    showToast('Данные загружены', 'success');
                } catch (err) {
                    showToast('Ошибка JSON: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
        }

        function handleFolder(files) {
            let count = 0;
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const url = URL.createObjectURL(file);
                    imageCache.set(file.path.toLowerCase(), url);
                    count++;
                }
            });

            document.querySelectorAll('.card-image').forEach(img => {
                const fname = img.dataset.filename.toLowerCase();
                if (imageCache.has(fname)) {
                    img.src = imageCache.get(fname);
                    img.classList.add('loaded');
                }
            });
            if (count > 0) showToast(`Загружено миниатюр: ${count}`, 'success');
        }

        // ── Stats ──
        function renderStats() {
            if (!rawData) return;
            const groups = rawData.groups || [];
            $('statGroups').textContent = rawData.total_groups || groups.length;
            $('statFiles').textContent = rawData.total_files || groups.reduce((acc, g) => acc + g.count, 0);

            let totalSize = 0, savings = 0;
            groups.forEach(g => {
                const sizes = g.files.map(f => f.size).sort((a, b) => b - a);
                totalSize += sizes.reduce((a, b) => a + b, 0);
                if (sizes.length > 1) savings += sizes.slice(1).reduce((a, b) => a + b, 0);
            });
            $('statSize').textContent = formatBytes(totalSize);
            $('statSavings').textContent = formatBytes(savings);
        }

        // ── Groups Rendering ──
        function renderGroups() {
            const container = $('groupsContainer');
            container.innerHTML = '';
            selectedFiles.clear();
            updateDeleteBtn();
            // Скрываем предыдущий вывод скрипта
            $('bashOutputContainer').classList.remove('visible');

            (rawData.groups || []).forEach(group => {
                const groupEl = document.createElement('div');
                groupEl.className = 'group-block';
                groupEl.dataset.groupId = group.group_id;

                const header = document.createElement('div');
                header.className = 'group-header';
                header.innerHTML = `
                    <div class="group-title">
                        <span>Группа #${group.group_id}</span>
                        <span class="badge">${group.count} файлов</span>
                    </div>
                    <div class="group-actions">
                        <button class="btn btn-sm" onclick="toggleGroupSelect(${group.group_id})">Инвертировать выбор</button>
                    </div>
                `;

                const grid = document.createElement('div');
                grid.className = 'files-grid';

                // Сортировка файлов группы по убыванию размера
                const sortedFiles = [...group.files].sort((a, b) => b.size - a.size);

                sortedFiles.forEach((file, index) => {
                    const card = document.createElement('div');
                    card.className = 'file-card';
                    card.dataset.path = file.path;
                    card.dataset.group = group.group_id;

                    // Класс first для самого крупного файла в группе
                    if (index === 0) {
                        card.classList.add('first');
                    }

                    const safePath = escapeHtml(file.path);
                    const safeName = escapeHtml(file.name);

                    // Для JS-строк экранируем одинарные кавычки и слеши
                    const jsSafePath = safePath.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                    const jsSafeName = safeName.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

                    card.innerHTML = `
                        <div class="card-image-wrapper" onclick="openLightbox('${jsSafeName}')">
                            <input type="checkbox" class="del-checkbox card-checkbox"
                                   value="${safePath}"
                                   onclick="event.stopPropagation()"
                                   onchange="toggleSelect(this, '${jsSafePath}')">
                            <img class="card-image" src="${safePath}" data-filename="${safeName}" alt="">
                        </div>
                        <div class="card-info">
                            <div class="card-size">${formatBytes(file.size)}</div>
                            <div class="card-name" title="${safeName}">${safeName}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                groupEl.appendChild(header);
                groupEl.appendChild(grid);
                container.appendChild(groupEl);
            });

            // Apply cached images
            if (imageCache.size > 0) {
                document.querySelectorAll('.card-image').forEach(img => {
                    const fname = img.dataset.filename.toLowerCase();
                    if (imageCache.has(fname)) {
                        img.src = imageCache.get(fname);
                        img.classList.add('loaded');
                    }
                });
            }
        }

        // ── Selection ──
        function toggleSelect(checkbox, path) {
            const card = checkbox.closest('.file-card');
            if (checkbox.checked) {
                selectedFiles.add(path);
                card.classList.add('selected');
            } else {
                selectedFiles.delete(path);
                card.classList.remove('selected');
            }
            updateDeleteBtn();
        }

        function toggleGroupSelect(groupId) {
            const groupEl = document.querySelector(`.group-block[data-group-id="${groupId}"]`);
            if (!groupEl) return;
            const cards = groupEl.querySelectorAll('.file-card');
            const allSelected = Array.from(cards).every(c => c.classList.contains('selected'));

            cards.forEach(card => {
                const checkbox = card.querySelector('.card-checkbox');
                const path = card.dataset.path;
                checkbox.checked = !allSelected;
                if (!allSelected) {
                    selectedFiles.add(path);
                    card.classList.add('selected');
                } else {
                    selectedFiles.delete(path);
                    card.classList.remove('selected');
                }
            });
            updateDeleteBtn();
        }

        function selectAllDuplicates() {
            if (!rawData) return;
            selectedFiles.clear();
            document.querySelectorAll('.file-card').forEach(card => {
                card.classList.remove('selected');
                card.querySelector('.card-checkbox').checked = false;
            });

            rawData.groups.forEach(group => {
                const files = group.files.slice().sort((a, b) => b.size - a.size);
                // Select all except the largest (keep the best)
                files.slice(1).forEach(f => {
                    const safePath = f.path;
                    selectedFiles.add(safePath);
                    const card = document.querySelector(`.file-card[data-path="${CSS.escape(safePath)}"]`);
                    if (card) {
                        card.classList.add('selected');
                        card.querySelector('.card-checkbox').checked = true;
                    }
                });
            });
            updateDeleteBtn();
            showToast(`Выбрано дубликатов: ${selectedFiles.size}`, 'info');
        }

        function updateDeleteBtn() {
            $('selectedCount').textContent = selectedFiles.size;
            $('deleteBtn').disabled = selectedFiles.size === 0;
        }

        // ── Bash script generation ──
        function generateBashCommands() {
            const checkboxes = document.querySelectorAll('.del-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('Не выбрано ни одного файла для удаления.');
                return;
            }

            // Собираем пути из value отмеченных чекбоксов
            const paths = Array.from(checkboxes).map(cb => cb.value);

            let script = '#!/bin/bash\n';
            paths.forEach(p => {
                // Экранирование одинарных кавычек для безопасной вставки в '…'
                const escaped = bashEscape(p);
                script += `rm ${escaped}\n`;
            });

            const container = $('bashOutputContainer');
            const textarea = $('bashOutput');
            textarea.value = script;
            container.classList.add('visible');
            textarea.select();
            showToast('Bash-скрипт сгенерирован. Скопируйте и выполните в терминале.', 'success');
        }

        // Экранирование пути для одиночных кавычек Bash: замена ' на '\''
        function bashEscape(path) {
            return `'${path.replace(/'/g, "'\\''")}'`;
        }

        // ── Search ──
        $('searchInput').addEventListener('input', e => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.group-block').forEach(block => {
                let hasVisible = false;
                block.querySelectorAll('.file-card').forEach(card => {
                    const match = card.innerText.toLowerCase().includes(term);
                    card.style.display = match ? 'flex' : 'none';
                    if (match) hasVisible = true;
                });
                block.style.display = hasVisible ? '' : 'none';
            });
        });

        // ── Lightbox ──
        function openLightbox(name) {
            const fname = name.toLowerCase();
            if (imageCache.has(fname)) {
                $('lightboxImg').src = imageCache.get(fname);
                $('lightboxInfo').textContent = name;
                $('lightbox').classList.add('active');
            } else if (imageCache.size === 0) {
                showToast('Перетащите папку с изображениями для просмотра', 'info');
            } else {
                showToast('Файл не найден в загруженной папке', 'error');
            }
        }

        function closeLightbox() {
            $('lightbox').classList.remove('active');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeLightbox();
        });

        // ── Helpers ──
        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
